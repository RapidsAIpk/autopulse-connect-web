name: CI / Deploy

# Every push / PR: type-check, lint, build. Push to main: ship the standalone build to the server and reload it.
# Secrets (repo → Settings → Secrets → Actions): SERVER_HOST, SERVER_USER, SERVER_SSH_KEY.
# Variables (repo → Settings → Secrets and variables → Actions → Variables):
#   DEPLOY_DOMAIN  default app.217-77-10-180.sslip.io: nginx site + free Let's Encrypt SSL, renewed when due
#                  (deploy/ensure-domain.sh; an existing site/certificate is left as it is).
#   CERTBOT_EMAIL  optional, Let's Encrypt expiry notices.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Baked into the build: Next forwards /api etc. to the API on the same box. Live updates (Socket.io)
      # go through nginx on the same origin, so no NEXT_PUBLIC_SOCKET_URL.
      API_ORIGIN: http://127.0.0.1:4009
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc --noEmit -p .
      - run: yarn lint
      - run: yarn build
      - name: Package standalone release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/static
          cp -r deploy .next/standalone/deploy
          tar -czf release.tgz -C .next/standalone .
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: web-release
          path: release.tgz
          retention-days: 7
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-release
      - name: Ship to the server and reload
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          # The one domain for frontend + backend (nginx splits the paths). New server/domain: set the
          # DEPLOY_DOMAIN variable; without it, the current server's domain is used.
          DOMAIN: ${{ vars.DEPLOY_DOMAIN || 'app.217-77-10-180.sslip.io' }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
        run: |
          [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ] || { echo "Missing secret: add SERVER_HOST, SERVER_USER and SERVER_SSH_KEY (repo → Settings → Secrets → Actions)"; exit 1; }
          # Only plain host names / e-mail characters go into the remote command line.
          # (bash pattern match, not grep: an empty value gives grep no line and counts as a failure)
          [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]*$ ]] || { echo "DEPLOY_DOMAIN is not a host name"; exit 1; }
          [[ "$CERTBOT_EMAIL" =~ ^[A-Za-z0-9._%+@-]*$ ]] || { echo "CERTBOT_EMAIL is not an e-mail"; exit 1; }
          install -m 600 /dev/null ~/key && printf '%s\n' "$KEY" > ~/key
          OPTS="-i $HOME/key -o StrictHostKeyChecking=accept-new"
          RID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          scp $OPTS release.tgz "$USER@$HOST:/tmp/web-$RID.tgz"
          ssh $OPTS "$USER@$HOST" "mkdir -p /tmp/web-$RID && tar -xzf /tmp/web-$RID.tgz -C /tmp/web-$RID ./deploy/remote-deploy.sh && DOMAIN='$DOMAIN' CERTBOT_EMAIL='$CERTBOT_EMAIL' bash /tmp/web-$RID/deploy/remote-deploy.sh /tmp/web-$RID.tgz $RID; s=\$?; rm -rf /tmp/web-$RID; exit \$s"
